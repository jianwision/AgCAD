<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUDA 几何实验室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1320;color:#e9f2fb;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{display:grid;grid-template-columns:300px 1fr;min-height:100vh}aside{padding:40px 28px;border-right:1px solid #263448;display:flex;flex-direction:column;gap:24px}.eyebrow{font-size:11px;letter-spacing:3px;color:#69d0e2}h1{font-size:28px;font-weight:600;line-height:1.3;margin:12px 0}p{color:#98adc1;margin:0}dl{margin:0;padding:20px 0;border-top:1px solid #263448;border-bottom:1px solid #263448}dt{font-size:12px;color:#98adc1}dd{margin:2px 0 16px;font-size:21px}dd:last-child{margin-bottom:0}.button{border:1px solid #39546e;border-radius:8px;background:#14283a;color:#ddf6ff;padding:10px 16px;cursor:pointer;text-align:center;text-decoration:none;font:inherit}.button:hover{background:#204057}.small{font-size:12px}section{position:relative;min-height:70vh;background:radial-gradient(ellipse at 50% 50%,#1e334b,#0b1320 75%)}canvas{width:100%;height:100%;position:absolute;touch-action:none}.hint{position:absolute;bottom:25px;width:100%;text-align:center;color:#8aacc2;font-size:12px;pointer-events:none}#error{position:absolute;top:20px;left:25px;right:25px;color:#ffbba8}@media(max-width:700px){main{grid-template-columns:1fr}aside{padding:20px;border:0;gap:12px}h1{font-size:24px}dl{display:flex;gap:30px;padding:10px 0}dd{font-size:17px}section{min-height:65vh}}
</style>
<main><aside><div><div class="eyebrow">RUST × CUDA</div><h1>让代码成为形状</h1><p>在 GPU 上生成的三维网格</p></div><dl><div><dt>三角形</dt><dd id="count"></dd></div><div><dt>坐标单位</dt><dd>mm</dd></div></dl><p>拖动旋转，滚轮缩放。沿不同角度检查表面和贯通孔。</p><button class="button" id="reset">重置视角</button><a class="button" href="model.stl" download>下载 STL</a><p class="small">网格已内嵌，可离线查看。此页面显示导出的网格；修改模型参数后需重新生成。</p></aside><section><canvas id="view"></canvas><div id="error"></div><div class="hint">拖动旋转 · 滚轮缩放</div></section></main>
<script>
'use strict';
try {
const radius=__RADIUS__, triangleCount=__TRIANGLES__;
document.getElementById('count').textContent=triangleCount.toLocaleString();
const encoded='__MESH__';
const bytes=Uint8Array.from(atob(encoded),x=>x.charCodeAt(0));
const vertices=new Float32Array(bytes.buffer);
const canvas=document.getElementById('view'), gl=canvas.getContext('webgl');
if(!gl)throw Error('此浏览器未启用 WebGL，请打开 preview.png 查看静态预览。');
const vertexSource=`attribute vec3 p;uniform float yaw,pitch,zoom,aspect,radius;varying vec3 world;void main(){world=p/radius;float c=cos(yaw),s=sin(yaw);vec3 q=vec3(c*world.x-s*world.y,s*world.x+c*world.y,world.z);float a=cos(pitch),b=sin(pitch);vec3 eye=vec3(q.x,a*q.z-b*q.y,b*q.z+a*q.y-zoom);gl_Position=vec4(eye.x*2.1/aspect,eye.y*2.1,-1.005*eye.z-0.2005,-eye.z);}`;
const fragmentSource=`#extension GL_OES_standard_derivatives : enable
precision highp float;varying vec3 world;void main(){vec3 n=normalize(cross(dFdx(world),dFdy(world)));if(!gl_FrontFacing)n=-n;vec3 light=normalize(vec3(-.5,-.6,1.));float diffuse=max(dot(n,light),0.);float rim=pow(1.-abs(n.z),3.);vec3 base=vec3(.06,.42,.63);vec3 color=base*(.22+.78*diffuse)+vec3(.06,.12,.17)*rim;gl_FragColor=vec4(sqrt(color),1.);}`;
if(!gl.getExtension('OES_standard_derivatives'))throw Error('浏览器缺少网格着色所需扩展。');
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertexSource));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragmentSource));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,vertices,gl.STATIC_DRAW);const location=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(location);gl.vertexAttribPointer(location,3,gl.FLOAT,false,0,0);gl.enable(gl.DEPTH_TEST);gl.clearColor(.043,.075,.125,1);
const uniforms=Object.fromEntries(['yaw','pitch','zoom','aspect','radius'].map(name=>[name,gl.getUniformLocation(program,name)]));let yaw=.5,pitch=.60,zoom=4.3;
function draw(){const ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(canvas.clientWidth*ratio);canvas.height=Math.round(canvas.clientHeight*ratio);gl.viewport(0,0,canvas.width,canvas.height);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniform1f(uniforms.yaw,yaw);gl.uniform1f(uniforms.pitch,pitch);gl.uniform1f(uniforms.zoom,zoom);gl.uniform1f(uniforms.aspect,canvas.width/canvas.height);gl.uniform1f(uniforms.radius,radius);gl.drawArrays(gl.TRIANGLES,0,vertices.length/3);}
let dragging=false,px=0,py=0;canvas.onpointerdown=e=>{dragging=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!dragging)return;yaw+=(e.clientX-px)*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-py)*.008));px=e.clientX;py=e.clientY;draw();};canvas.onpointerup=canvas.onpointercancel=()=>dragging=false;canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(2,Math.min(12,zoom*Math.exp(e.deltaY*.001)));draw();},{passive:false});document.getElementById('reset').onclick=()=>{yaw=.5;pitch=.60;zoom=4.3;draw();};new ResizeObserver(draw).observe(canvas);draw();
}catch(error){document.getElementById('error').textContent=error.message;console.error(error);}
</script>
</html>
